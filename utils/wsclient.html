<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dynamic WebSocket Stream</title>
    <style>
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        background: #121212;
        color: #e0e0e0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 20px;
      }
      #stream {
        max-width: 100%;
        height: auto;
        border: 3px solid #333;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        background: #000;
      }
      .info-panel {
        margin-bottom: 20px;
        text-align: center;
      }
      #status {
        font-weight: bold;
        padding: 5px 15px;
        border-radius: 20px;
        display: inline-block;
        margin-top: 10px;
        background: #222;
      }
    </style>
  </head>
  <body>
    <div class="info-panel">
      <h1>Live Stream</h1>
      <div id="address-display">Connecting to...</div>
      <div id="status">INITIALIZING</div>
    </div>

    <img id="stream" src="" alt="Stream not started" />

    <script>
      const img = document.getElementById("stream");
      const statusDiv = document.getElementById("status");
      const addressDiv = document.getElementById("address-display");

      // 1. Parse Query Parameters
      const params = new URLSearchParams(window.location.search);
      const host = params.get("host") || "localhost";
      const port = params.get("port") || "8080";
      const wsUrl = `ws://${host}:${port}`;

      addressDiv.textContent = `Target: ${wsUrl}`;

      // 2. Initialize WebSocket
      const socket = new WebSocket(wsUrl);
      socket.binaryType = "blob";

      socket.onopen = () => {
        statusDiv.textContent = "CONNECTED";
        statusDiv.style.color = "#00ff00";
        statusDiv.style.border = "1px solid #00ff00";
      };

      socket.onmessage = (event) => {
        // Check if data is indeed a blob/image
        console.log(event);

        if (event.data instanceof Blob) {
          const url = URL.createObjectURL(event.data);

          // Old URL cleanup to prevent memory leaks
          const oldUrl = img.src;
          img.src = url;

          img.onload = () => {
            if (oldUrl.startsWith("blob:")) {
              URL.revokeObjectURL(oldUrl);
            }
          };
        }
      };

      socket.onclose = (e) => {
        statusDiv.textContent = "DISCONNECTED";
        statusDiv.style.color = "#ff4444";
        statusDiv.style.border = "1px solid #ff4444";
        console.log("Socket closed:", e.reason);
      };

      socket.onerror = (err) => {
        statusDiv.textContent = "CONNECTION ERROR";
        console.error("WS Error:", err);
      };
    </script>
  </body>
</html>
